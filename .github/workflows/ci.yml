name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend && pip install -r requirements.txt
        
    - name: Lint with Flake8
      run: |
        cd backend && flake8 firewall api analytics tests
        
    - name: Run Tests with Coverage
      run: |
        cd backend && pytest tests/ --cov=firewall --cov=api --cov-report=xml

    - name: Validate rule, network, and ML detection tests
      run: |
        cd backend && pytest tests/test_rule_engine.py tests/attack_validation/ -v
        
    - name: Security Scan (Bandit)
      run: |
        cd backend && bandit -r firewall/ api/
        
    - name: Dependency Audit (pip-audit)
      run: |
        cd backend && pip-audit -r requirements.txt
        
    - name: Generate SBOM (CycloneDX)
      run: |
        cd backend && cyclonedx-py requirements requirements.txt -o sbom.json
        
    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: backend/sbom.json

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Run static UI tests
      run: python frontend/test_static_site.py

    - name: Validate dashboard JavaScript
      run: node --check frontend/app.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Validate compose configuration
      run: docker compose config --quiet
    - name: Build backend image
      run: docker build -t ai-firewall-backend-test ./backend
    - name: Build frontend image
      run: docker build -t ai-firewall-frontend-test ./frontend
